name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Dikunci ke Ubuntu 24.04 supaya build tidak berubah saat "ubuntu-latest" pindah versi
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK sudah ada di server GitHub, cukup pastikan lisensinya diterima
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: GTLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
