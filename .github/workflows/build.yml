name: Build APK

on:
  push:
    branches: [ main, master, feature/priority ]
  workflow_dispatch:

# Izin untuk membuat GitHub Release (dipakai Obtainium untuk memantau versi baru)
permissions:
  contents: write

jobs:
  build:
    # Dikunci ke Ubuntu 24.04 supaya build tidak berubah saat "ubuntu-latest" pindah versi
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK sudah ada di server GitHub, cukup pastikan lisensinya diterima
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK release
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Tampilkan error kompilasi
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE:|What went wrong" build.log | head -80 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Siapkan nama dan nomor versi
        id: ver
        run: |
          BASE=$(grep '^APP_VERSION=' gradle.properties | cut -d= -f2)
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "GTLauncher-v${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Unggah APK (cadangan di tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: GTLauncher-release-apk
          path: GTLauncher-v${{ steps.ver.outputs.version }}.apk
          retention-days: 30

      - name: Buat GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "GTLauncher-v${{ steps.ver.outputs.version }}.apk" \
            --target "${{ github.sha }}" \
            --title "GT Launcher v${{ steps.ver.outputs.version }}" \
            --notes "Build otomatis dari commit ${{ github.sha }}"
